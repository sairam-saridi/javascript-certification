<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather App</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <main class="app">

```
<h1>Weather App</h1>
<p class="subtitle">Discover the weather around the world</p>

<div class="controlPanel">

  <label for="weather-options">Weather For:</label>

  <select id="weather-options">
    <option value=""></option>
    <option value="new york">New York</option>
    <option value="los angeles">Los Angeles</option>
    <option value="chicago">Chicago</option>
    <option value="paris">Paris</option>
    <option value="tokyo">Tokyo</option>
    <option value="london">London</option>
  </select>

  <button id="get-weather-btn">Get Weather</button>

</div>

<div class="displayWeather">

  <div class="weather-header">
    <div>
      <h2 id="location">N/A</h2>
      <p id="weather-main">N/A</p>
    </div>

    <img id="weather-icon" src="" alt="Weather icon">
  </div>

  <div class="temperature-section">
    <p id="main-temperature">N/A</p>
    <p id="feels-like">Feels like: N/A</p>
  </div>

  <div class="weather-details">

    <div class="detail">
      <span>Humidity</span>
      <strong id="humidity">N/A</strong>
    </div>

    <div class="detail">
      <span>Wind Speed</span>
      <strong id="wind">N/A</strong>
    </div>

    <div class="detail">
      <span>Wind Gust</span>
      <strong id="wind-gust">N/A</strong>
    </div>

  </div>

</div>
```

  </main>

  <script src="script.js"></script>

</body>
</html>
